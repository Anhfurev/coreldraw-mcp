[project]
name = "coreldraw-signage-mcp"
version = "0.1.0"
description = "AI Agent + MCP Server + CorelDRAW COM API for automated signage design"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "深圳市玄熵智能科技有限责任公司", email = "wuguirong@gmail.com" }]
keywords = ["coreldraw", "mcp", "ai-agent", "automation", "signage", "com"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "anthropic>=0.40.0",
    "pywin32>=306",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "qrcode[pil]>=7.4.0",
    "python-barcode>=0.15.0",
    "Pillow>=10.0.0",
    "loguru>=0.7.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]